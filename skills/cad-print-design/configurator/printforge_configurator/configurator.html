<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAD Configurator</title>
<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" } }
</script>
<style>
:root {
  --bg: #f4f6f8; --panel: #ffffff; --panel-2: #f6f7f9; --fg: #1c2330; --muted: #6b7480; --line: #e1e5eb;
  --accent: #2563eb; --accent-fg: #ffffff; --amber: #d97706; --dirty: #fff3c4; --err: #b42318; --err-bg: #fdecea; --dim: #15803d;
  --viewer: #e9edf2; --viewer-grad: linear-gradient(180deg, #f3f5f8, #e6eaf0); --input: #ffffff; --btn: #ffffff;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181f; --panel: #1b2029; --fg: #e4e8ee; --muted: #8e98a6; --line: #2c3340;
    --accent: #5b8def; --accent-fg: #0b1220; --dirty: #4a3f1a; --err: #ff8a80; --err-bg: #3d1f1f; --dim: #4ade80; --dim: #4ade80;
    --viewer: #0f1319; --input: #11151c; --btn: #242b37;
  }
}
:root[data-theme="dark"] {
  --bg: #14181f; --panel: #1b2029; --fg: #e4e8ee; --muted: #8e98a6; --line: #2c3340;
  --accent: #5b8def; --accent-fg: #0b1220; --dirty: #4a3f1a; --err: #ff8a80; --err-bg: #3d1f1f; --dim: #4ade80;
  --viewer: #0f1319; --input: #11151c; --btn: #242b37;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header: 56 px, one 36 px control height */
header {
  display: flex; flex-wrap: nowrap; align-items: center; gap: 8px;
  height: 56px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line);
}
#model {
  font-size: 14px; font-weight: 600; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#saveMsg { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
#saveMsg.err { color: var(--err); }
button, .btn {
  font: inherit; font-size: 13px; color: var(--fg); background: var(--btn); border: 1px solid var(--line);
  border-radius: 8px; height: 36px; padding: 0 12px; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
button:hover:not(:disabled) { border-color: #cdd4dd; }
button:disabled { opacity: .55; cursor: default; }
#rebuild { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
#rebuild:hover:not(:disabled) { border-color: var(--accent); filter: brightness(1.06); }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; font-size: 13px; }
.spin {
  display: none; width: 12px; height: 12px; border: 2px solid currentColor;
  border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite;
}
#rebuild.busy .spin { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 3D / Drawing segmented control */
.seg {
  display: inline-flex; flex: none; height: 36px; padding: 3px; gap: 2px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2);
}
.seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; font-size: 13px; }
.seg button:hover:not(:disabled) { border: 0; color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--panel); box-shadow: 0 1px 2px rgba(16, 24, 40, .12); font-weight: 600; }

/* Toggle switches */
input[type=checkbox] {
  -webkit-appearance: none; appearance: none; position: relative; flex: none;
  width: 36px; height: 20px; margin: 0; border-radius: 10px; background: #cdd4dd; cursor: pointer;
  transition: background .15s;
}
input[type=checkbox]::after {
  content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 2px rgba(16, 24, 40, .25); transition: transform .15s;
}
input[type=checkbox]:checked { background: var(--accent); }
input[type=checkbox]:checked::after { transform: translateX(16px); }

/* Dropdown menus */
.dd { position: relative; }
.dd > button[aria-expanded="true"] { border-color: var(--accent); }
.menu {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 20; min-width: 220px;
  display: flex; flex-direction: column; gap: 2px; padding: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 8px 24px rgba(16, 24, 40, .12);
}
.menu > a, .menu > label {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 36px; padding: 0 10px;
  border-radius: 8px; color: var(--fg); text-decoration: none; white-space: nowrap; font-size: 13px;
}
.menu > a:hover, .menu > label:hover { background: var(--panel-2); }
.menu > a[hidden], .menu > label[hidden] { display: none; }

main { flex: 1; display: flex; min-height: 0; }

/* Panel: cards on a light grey background */
aside {
  width: 340px; flex: none; overflow-y: auto; background: var(--panel-2);
  border-right: 1px solid var(--line); display: flex; flex-direction: column;
}
#groups { flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.group { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.ghead {
  display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 8px 0 14px;
  cursor: pointer; user-select: none;
}
.ghead:hover { background: var(--panel-2); }
.ghead:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.gicon { flex: none; width: 20px; text-align: center; font-size: 16px; line-height: 1; }
.gtitle {
  flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.gdot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.icon-btn {
  flex: none; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 8px; background: transparent;
  color: var(--muted); font-size: 15px; line-height: 1; justify-content: center;
}
.icon-btn:hover:not(:disabled) { color: var(--accent); background: var(--panel-2); border: 0; }
.chev { flex: none; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); transition: transform .15s; }
.chev-ico { display: block; }
button .chev-ico { margin-left: 4px; vertical-align: -2px; color: var(--muted); }
.group.open > .ghead .chev { transform: rotate(180deg); }
.gbody { border-top: 1px solid var(--line); }
.gbody[hidden] { display: none; }

/* Parameter rows */
.row { position: relative; padding: 12px 14px; }
.row + .row { border-top: 1px solid var(--line); }
.row.dirty::before, .row.selected::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.row.dirty::before { background: var(--amber); }
.row.selected::after { background: var(--accent); }
.row.dirty.selected::before { left: 3px; }
.row.selected { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.row-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.name { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; min-width: 0; cursor: pointer; }
.name:hover .ptitle { text-decoration: underline; }
.ptitle { font-size: 13px; font-weight: 600; }
.ptag { font: 11px/1.2 var(--mono); color: var(--muted); }
.row-head > div:last-child { flex: none; }

/* Number field with flat steppers */
.numctl {
  display: inline-flex; align-items: stretch; flex: none; height: 36px; overflow: hidden;
  border: 1px solid var(--line); border-radius: 8px; background: var(--input);
}
.numctl:focus-within { outline: 2px solid var(--accent); outline-offset: 0; }
.numctl input {
  width: 60px; border: 0; border-radius: 0; padding: 0 2px; background: transparent; color: var(--fg);
  font: 13px var(--mono); text-align: center; outline: none; -moz-appearance: textfield;
}
.numctl input::-webkit-outer-spin-button, .numctl input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.numctl .step {
  width: 28px; height: auto; padding: 0; border: 0; border-radius: 0; background: transparent;
  color: var(--muted); font-size: 16px; line-height: 1; justify-content: center;
}
.numctl .step:hover:not(:disabled) { color: var(--fg); background: var(--panel-2); border: 0; }
.numctl .step:disabled { opacity: .35; }

/* Slider: 4 px track, accent fill up to the thumb */
.rowbottom { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
input[type=range] {
  -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 4px; margin: 0; border-radius: 2px; cursor: pointer;
  background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--line) var(--p, 0%));
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%;
  background: #fff; border: 1px solid var(--accent); box-shadow: 0 1px 2px rgba(16, 24, 40, .2);
}
input[type=range]::-moz-range-thumb {
  box-sizing: border-box; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; border: 1px solid var(--accent); box-shadow: 0 1px 2px rgba(16, 24, 40, .2);
}
input[type=range]::-moz-range-track { height: 4px; background: transparent; }
input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

/* Build log */
#logbox { margin-top: auto; border-top: 1px solid var(--line); padding: 8px 14px; background: var(--panel); }
#logbox summary { cursor: pointer; font-weight: 600; font-size: 13px; }
#logbox pre {
  font: 11.5px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word;
  max-height: 220px; overflow: auto; margin: 6px 0 0; color: var(--muted);
}
#logbox.error { background: var(--err-bg); }
#logbox.error summary, #logbox.error pre { color: var(--err); }

/* Viewer */
#viewer { flex: 1; position: relative; min-width: 0; background: var(--viewer-grad, var(--viewer)); overflow: hidden; }
#viewer canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#tools {
  position: absolute; top: 12px; right: 12px; display: flex; padding: 3px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
}
#tools button {
  height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; font-size: 13px;
}
#tools button:hover:not(:disabled) { background: var(--panel-2); border: 0; }
/* Drawing sheet, shown in place of the 3D view */
#sheet { position: absolute; inset: 0; overflow: hidden; }
#sheetVp { position: absolute; top: 52px; left: 0; right: 0; bottom: 0; overflow: hidden; cursor: grab; touch-action: none; user-select: none; }
#pager { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 2; }
#sheetVp.panning { cursor: grabbing; }
#sheetPaper { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#zoomBar {
  position: absolute; right: 12px; bottom: 12px; display: flex; gap: 2px; padding: 3px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
}
#zoomBar button { height: 30px; min-width: 34px; padding: 0 10px; border: 0; border-radius: 999px; background: transparent; font-size: 13px; }
#zoomBar button:hover:not(:disabled) { background: var(--panel-2); border: 0; }
#zoomBar .check { height: 30px; padding: 0 8px; font-size: 13px; }
#sheetPaper svg { display: block; width: 960px; height: 680px; box-shadow: 0 1px 3px rgba(16, 24, 40, .1); }
#sheetMsg {
  position: absolute; top: 60px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: 13px;
}
#sheetMsg.err { color: var(--err); }
#sheetMsg .spin { display: inline-block; }
#viewer.drawing > canvas, #viewer.drawing #tools, #viewer.drawing #readout, #viewer.drawing #flabel,
#viewer.drawing #ftip, #viewer.drawing .dimlabel { display: none !important; }
#readout {
  position: absolute; left: 12px; bottom: 12px; display: flex; flex-direction: column; align-items: flex-start;
  gap: 8px; padding: 12px; max-width: calc(100% - 24px); pointer-events: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
}
#info { font: 12px/1.4 var(--mono); color: var(--fg); white-space: nowrap; }
#info:empty { display: none; }
#hint { font-size: 12px; color: var(--muted); }
#flabel, #ftip {
  position: absolute; left: 0; top: 0; pointer-events: none; white-space: nowrap;
  background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 10px; font-size: 12px;
}
#flabel { border-color: var(--accent); }
#flabel b { margin-right: 6px; font-weight: 600; }
#flabel .fp { font: 11px var(--mono); color: var(--muted); margin-right: 6px; }
#ftip { font-weight: 600; }
.dimlabel {
  position: absolute; left: 0; top: 0; pointer-events: none; white-space: nowrap;
  font: 600 12px/1 var(--mono); color: var(--dim); background: var(--panel);
  border: 1px solid var(--dim); border-radius: 999px; padding: 4px 8px;
}
@media (max-width: 799px) {
  html, body { height: auto; }
  main { flex-direction: column; flex: none; }
  aside { width: auto; max-height: 50vh; border-right: 0; border-bottom: 1px solid var(--line); }
  #viewer { flex: none; height: 70vh; }
}
</style>
</head>
<body>
<header>
  <span id="model">loading...</span>
  <div class="seg" id="modeSeg" role="group" aria-label="View mode">
    <button type="button" data-mode="3d" aria-pressed="true">3D</button>
    <button type="button" data-mode="drawing" aria-pressed="false">Drawing</button>
  </div>
  <button id="rebuild" disabled><span class="spin"></span>Rebuild</button>
  <div class="dd" id="viewWrap">
    <button id="viewBtn" aria-haspopup="true" aria-expanded="false">View <svg class="chev-ico" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="menu" id="viewMenu" hidden>
      <label class="check mi"><input type="checkbox" id="auto"> Auto rebuild</label>
      <label class="check mi" id="devWrap" hidden><input type="checkbox" id="showDev" checked> Show device</label>
      <label class="check mi"><input type="checkbox" id="showDims" checked> Dimensions</label>
    </div>
  </div>
  <div class="dd" id="dlWrap">
    <button id="dlBtn" aria-haspopup="true" aria-expanded="false" disabled>Download <svg class="chev-ico" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="menu" id="dlMenu" hidden>
      <a id="dlSleeve" href="/api/mesh/shell.stl" download="part.stl">Sleeve STL</a>
      <a id="dlStep" href="/api/step" download="part.step">Sleeve STEP</a>
      <a id="dlDrawing" href="#">Drawing SVG</a>
      <a id="dlAll" href="#">Drawing, all views SVG</a>
      <a id="dlDev" href="/api/mesh/device.stl" download="device.stl" hidden>Device STL</a>
    </div>
  </div>
  <button id="save" disabled>Save to script</button>
  <span id="saveMsg"></span>
</header>
<main>
  <aside>
    <div id="groups"></div>
    <details id="logbox" open>
      <summary>Build log</summary>
      <pre id="log"></pre>
    </details>
  </aside>
  <section id="viewer">
    <div id="tools">
      <button data-view="fit">Fit</button>
      <button data-view="iso">Iso</button>
      <button data-view="top">Top</button>
      <button data-view="front">Front</button>
    </div>
    <div id="readout">
      <div id="info"></div>
      <div id="hint">Click a feature to see its settings</div>
    </div>
    <section id="sheet" hidden>
      <div class="seg pager" id="pager" role="group" aria-label="Drawing page">
        <button type="button" data-page="top">Top</button>
        <button type="button" data-page="front">Front</button>
        <button type="button" data-page="right">Right</button>
        <button type="button" data-page="iso">Iso</button>
      </div>
      <div id="sheetVp"><div id="sheetPaper"></div></div>
      <div id="sheetMsg" hidden></div>
      <div id="zoomBar">
        <button type="button" id="zFit">Fit</button>
        <button type="button" id="zOut" aria-label="Zoom out">−</button>
        <button type="button" id="zIn" aria-label="Zoom in">+</button>
        <button type="button" id="z1">1:1</button>
        <label class="check" id="allWrap"><input type="checkbox" id="showAll"> Show all</label>
      </div>
    </section>
  </section>
</main>
<script type="module">
const $ = (id) => document.getElementById(id);
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
const json = (body) => ({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const state = {
  values: {}, initial: {}, built: {}, ctl: {}, busy: false, queued: false, timer: 0, ready: false,
  features: [], selected: null, groups: new Map(), buildKey: null, model: '', stem: 'part',
};
let viewer = null;

function showLog(text, bad) {
  $('log').textContent = text || '(no output)';
  $('logbox').classList.toggle('error', !!bad);
  if (bad) $('logbox').open = true;
}
function setBusy(on) {
  const b = $('rebuild');
  b.classList.toggle('busy', on);
  b.disabled = on || !state.ready;
}
function markDirty() {
  const dirtyGroups = new Set();
  for (const name in state.ctl) {
    const d = state.values[name] !== state.built[name];
    state.ctl[name].row.classList.toggle('dirty', d);
    if (d) dirtyGroups.add(state.ctl[name].group);
  }
  for (const [title, g] of state.groups) g.dot.hidden = !dirtyGroups.has(title);
}
function changed() {
  markDirty();
  clearTimeout(state.timer);
  if ($('auto').checked) state.timer = setTimeout(build, 800);
}
function setValue(name, v) { state.values[name] = v; changed(); }

// Highlight the rows of a feature, scroll to the first, and move the viewer marker.
// name = null clears the selection.
function select(name, at) {
  const f = name ? state.features.find((x) => x.name === name) : null;
  state.selected = f ? f.name : null;
  const rows = f ? f.params.filter((pn) => state.ctl[pn]) : [];
  for (const pn in state.ctl) state.ctl[pn].row.classList.toggle('selected', rows.includes(pn));
  for (const pn of rows) setGroupOpen(state.ctl[pn].group, true); // open first, so the row can be scrolled to
  if (rows.length) state.ctl[rows[0]].row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  if (f) $('hint').hidden = true;
  viewer?.setMarker(f, at);
}

async function build() {
  if (!state.ready) return;
  if (state.busy) { state.queued = true; return; }
  state.busy = true; state.queued = false;
  const snap = { ...state.values };
  setBusy(true);
  try {
    const r = await fetch('/api/build', json({ values: snap }));
    const res = await r.json().catch(() => ({ ok: false, log: `HTTP ${r.status}: invalid response` }));
    showLog(res.log, !res.ok);
    if (res.ok) {
      state.built = snap;
      state.features = res.features || [];
      state.buildKey = res.key ?? null;
      $('info').textContent = `${res.bbox.map((v) => v.toFixed(1)).join(' × ')} mm · ${Math.round(res.volume_cm3)} cm³ · ${res.cached ? 'cached' : Math.round(res.seconds) + ' s'}`;
      $('dlBtn').disabled = false;
      $('dlDev').hidden = !res.device;
      const v = await viewerReady;
      if (v) await v.show(res);
      select(state.selected); // re-anchor the same feature, or clear if it is gone
      if (drawingMode) ensureDrawing();
    }
  } catch (e) {
    showLog(String(e), true);
  } finally {
    state.busy = false;
    setBusy(false);
    markDirty();
    if (state.queued) build();
  }
}

function makeRow(p, group) {
  const row = el('div', 'row');
  const head = el('div', 'row-head');
  const left = el('div');
  const name = el('div', 'name');
  const title = el('span', 'ptitle'); title.textContent = p.description || p.name;
  const tag = el('span', 'ptag'); tag.textContent = p.name;
  name.append(title, tag);
  name.addEventListener('click', () => {
    const f = state.features.find((x) => x.params.includes(p.name));
    if (f) select(f.name);
  });
  left.append(name);
  const ctl = el('div');
  head.append(left, ctl);
  row.append(head);
  let sync;
  if (p.type === 'bool') {
    const cb = el('input'); cb.type = 'checkbox';
    cb.addEventListener('change', () => setValue(p.name, cb.checked));
    ctl.append(cb);
    sync = (v) => { cb.checked = !!v; };
  } else {
    const step = Number.isInteger(p.value) ? 1 : 0.1;
    const clamp = (v) => Math.min(p.max ?? Infinity, Math.max(p.min ?? -Infinity, v));
    const numctl = el('div', 'numctl');
    const minus = el('button', 'step'); minus.type = 'button'; minus.textContent = '−'; minus.title = 'Decrease';
    const plus = el('button', 'step'); plus.type = 'button'; plus.textContent = '+'; plus.title = 'Increase';
    const num = el('input'); num.type = 'number'; num.step = step;
    numctl.append(minus, num, plus);
    let rng = null;
    const paint = (r) => r.style.setProperty('--p', `${Math.min(100, Math.max(0, ((r.value - r.min) / (r.max - r.min)) * 100))}%`);
    const bounds = (v) => {
      minus.disabled = p.min != null && v <= p.min;
      plus.disabled = p.max != null && v >= p.max;
    };
    const stepBy = (dir) => {
      const cur = parseFloat(num.value);
      const base = Number.isNaN(cur) ? state.values[p.name] : cur;
      const v = clamp(Number((base + dir * step).toFixed(6)));
      sync(v);
      setValue(p.name, v);
    };
    minus.addEventListener('click', () => stepBy(-1));
    plus.addEventListener('click', () => stepBy(1));
    num.addEventListener('input', () => {
      const v = parseFloat(num.value);
      if (Number.isNaN(v)) return;
      setValue(p.name, v);
      if (rng) { rng.value = v; paint(rng); }
      bounds(v);
    });
    if (p.min != null || p.max != null) {
      rng = el('input'); rng.type = 'range'; rng.step = step;
      rng.min = p.min ?? 0;
      rng.max = p.max ?? Math.max(10, p.value * 2);
      rng.addEventListener('input', () => {
        paint(rng);
        num.value = rng.value;
        bounds(parseFloat(rng.value));
        setValue(p.name, parseFloat(rng.value));
      });
      // MakerWorld layout: value box on the left of the slider, under the title.
      const bottom = el('div', 'rowbottom');
      bottom.append(numctl, rng);
      row.append(bottom);
    } else {
      ctl.append(numctl);
    }
    sync = (v) => { num.value = v; if (rng) { rng.value = v; paint(rng); } bounds(v); };
  }
  sync(p.value);
  state.ctl[p.name] = { row, sync, group };
  return row;
}

// Accordion state, remembered per model in localStorage (storage may be unavailable).
let groupKey = 'cfg.groups.';
let openMap = {};
function loadOpen() {
  try { return JSON.parse(localStorage.getItem(groupKey)) || {}; } catch (e) { return {}; }
}
function saveOpen() {
  try { localStorage.setItem(groupKey, JSON.stringify(openMap)); } catch (e) { /* ignore */ }
}
function setGroupOpen(title, open, persist = true) {
  const g = state.groups.get(title);
  if (!g) return;
  g.sec.classList.toggle('open', open);
  g.body.hidden = !open;
  g.head.setAttribute('aria-expanded', String(open));
  if (persist) { openMap[title] = open; saveOpen(); }
}

function renderPanel(groups, model) {
  groupKey = `cfg.groups.${model}`;
  openMap = loadOpen();
  const wrap = $('groups');
  groups.forEach((g, i) => {
    const sec = el('section', 'group');
    const head = el('div', 'ghead');
    head.tabIndex = 0;
    head.setAttribute('role', 'button');
    const icon = el('span', 'gicon'); icon.textContent = g.icon || '▪';
    const title = el('span', 'gtitle'); title.textContent = g.title;
    const dot = el('span', 'gdot'); dot.hidden = true; dot.title = 'Changed, not built yet';
    const reset = el('button', 'icon-btn');
    reset.type = 'button';
    reset.textContent = '↺';
    reset.title = 'Reset group';
    reset.setAttribute('aria-label', 'Reset group');
    reset.addEventListener('click', (e) => {
      e.stopPropagation();
      for (const p of g.params) {
        state.values[p.name] = state.initial[p.name];
        state.ctl[p.name].sync(state.initial[p.name]);
      }
      changed();
    });
    const chev = el('span', 'chev'); chev.innerHTML = '<svg class="chev-ico" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    head.append(icon, title, dot, reset, chev);
    const body = el('div', 'gbody');
    for (const p of g.params) body.append(makeRow(p, g.title));
    sec.append(head, body);
    wrap.append(sec);
    state.groups.set(g.title, { sec, head, body, dot });
    const toggle = () => setGroupOpen(g.title, body.hidden);
    head.addEventListener('click', toggle);
    head.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
    // First group open by default; the rest closed unless remembered.
    setGroupOpen(g.title, g.title in openMap ? !!openMap[g.title] : i === 0, false);
  });
}

async function init() {
  try {
    const r = await fetch('/api/params');
    if (!r.ok) throw new Error(`/api/params returned HTTP ${r.status}`);
    const data = await r.json();
    const stem = data.model.replace(/\.py$/, '');
    $('model').textContent = data.model;
    state.model = data.model; state.stem = stem;
    $('dlSleeve').textContent = `${stem}.stl`; $('dlSleeve').download = `${stem}.stl`;
    $('dlStep').textContent = `${stem}.step`; $('dlStep').download = `${stem}.step`;
    $('dlDev').textContent = `${stem}_device.stl`; $('dlDev').download = `${stem}_device.stl`;
    $('devWrap').hidden = !data.has_device;
    for (const g of data.groups) {
      for (const p of g.params) { state.values[p.name] = p.value; state.initial[p.name] = p.value; }
    }
    state.built = { ...state.values };
    renderPanel(data.groups, data.model);
    state.ready = true;
    $('save').disabled = false;
    setBusy(false);
    build();
  } catch (e) {
    showLog(`Could not load parameters: ${e.message}`, true);
  }
}

async function loadViewer() {
  try {
    const [T, { STLLoader }, { OrbitControls }] = await Promise.all([
      import('three'),
      import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/STLLoader.js'),
      import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js'),
    ]);
    return makeViewer(T, STLLoader, OrbitControls);
  } catch (e) {
    showLog(`3D viewer unavailable: ${e.message}`, true);
    return null;
  }
}

function makeViewer(T, STLLoader, OrbitControls) {
  const host = $('viewer');
  const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  host.prepend(renderer.domElement);
  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(35, 1, 0.1, 1e5);
  camera.up.set(0, 0, 1);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  const sun = new T.DirectionalLight(0xffffff, 1.6); sun.position.set(1, -2, 3);
  const fill = new T.DirectionalLight(0xffffff, 0.35); fill.position.set(-2, 1, -1);
  scene.add(new T.HemisphereLight(0xffffff, 0x556070, 0.9), sun, fill);
  const shellMat = new T.MeshStandardMaterial({ color: 0xc8ccd2, roughness: 0.55, metalness: 0.05 });
  const devMat = new T.MeshStandardMaterial({ color: 0x2f7fd6, transparent: true, opacity: 0.35, depthWrite: false });
  const root = new T.Group();
  scene.add(root);
  const loader = new STLLoader();
  let shell = null, device = null, grid = null, fitted = false, devOn = true, shownKey = null;
  let center = new T.Vector3(), radius = 50;

  const resize = () => {
    const w = Math.max(host.clientWidth, 1), h = Math.max(host.clientHeight, 1);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  };
  new ResizeObserver(resize).observe(host);
  resize();
  // Feature marker, label overlay and tooltip.
  const accent = new T.Color(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2563eb');
  // Unit sphere; show() scales it to 0.4% of the part size, clamped to [0.3, 1.5] mm.
  const marker = new T.Mesh(new T.SphereGeometry(1, 16, 12), new T.MeshStandardMaterial({ color: accent, emissive: accent, emissiveIntensity: 0.6 }));
  marker.visible = false;
  scene.add(marker);
  const label = el('div'); label.id = 'flabel'; label.hidden = true;
  const tip = el('div'); tip.id = 'ftip'; tip.hidden = true;
  host.append(label, tip);
  const canvas = renderer.domElement;
  let features = [], anchored = null, anchorPos = null;
  const placeLabel = () => {
    if (!anchored) return;
    const p = anchorPos.clone();
    if (p.clone().sub(camera.position).dot(camera.getWorldDirection(new T.Vector3())) <= 0) { label.hidden = true; return; }
    p.project(camera);
    label.hidden = false;
    label.style.transform = `translate(${((p.x + 1) / 2) * host.clientWidth + 10}px, ${((1 - p.y) / 2) * host.clientHeight - 28}px)`;
  };
  // Overall-size dimensions: grey bounding box and extension lines, green dimension
  // lines with end ticks, and HTML labels. Kept out of the raycast targets.
  const DIM_GREEN = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--dim').trim().slice(1), 16) || 0x15803d;
  const DIM_GREY = 0x6b7480;
  const dimGroup = new T.Group();
  scene.add(dimGroup);
  let dimsOn = true, box = null, dimLabels = [];
  const clearDims = () => {
    for (const c of dimGroup.children) { c.geometry.dispose(); c.material.dispose(); }
    dimGroup.clear();
    for (const d of dimLabels) d.el.remove();
    dimLabels = [];
  };
  const rebuildDims = () => {
    clearDims();
    if (!dimsOn || !box) return;
    const { min, max } = box;
    const size = box.getSize(new T.Vector3());
    const L = Math.max(size.x, size.y, size.z);
    const off = 0.06 * L, tk = 0.015 * L;
    const grey = [], green = [];
    const seg = (list, a, b) => list.push(new T.Vector3(...a), new T.Vector3(...b));
    const corner = (i) => [i & 1 ? max.x : min.x, i & 2 ? max.y : min.y, i & 4 ? max.z : min.z];
    for (let i = 0; i < 8; i++) {
      for (const bit of [1, 2, 4]) if (!(i & bit)) seg(grey, corner(i), corner(i | bit));
    }
    // X along the front-bottom edge, Y along the right-bottom edge, Z along the front-right vertical edge.
    const xo = min.y - off, yo = max.x + off, zo = min.y - off;
    seg(grey, corner(0), [min.x, xo, min.z]);
    seg(grey, corner(1), [max.x, xo, min.z]);
    seg(grey, corner(1), [yo, min.y, min.z]);
    seg(grey, corner(3), [yo, max.y, min.z]);
    seg(grey, corner(1), [yo, zo, min.z]);
    seg(grey, corner(5), [yo, zo, max.z]);
    seg(green, [min.x, xo, min.z], [max.x, xo, min.z]);
    seg(green, [min.x, xo, min.z - tk], [min.x, xo, min.z + tk]);
    seg(green, [max.x, xo, min.z - tk], [max.x, xo, min.z + tk]);
    seg(green, [yo, min.y, min.z], [yo, max.y, min.z]);
    seg(green, [yo, min.y, min.z - tk], [yo, min.y, min.z + tk]);
    seg(green, [yo, max.y, min.z - tk], [yo, max.y, min.z + tk]);
    seg(green, [yo, zo, min.z], [yo, zo, max.z]);
    seg(green, [yo - tk, zo, min.z], [yo + tk, zo, min.z]);
    seg(green, [yo - tk, zo, max.z], [yo + tk, zo, max.z]);
    const lines = (pts, color, opacity) => {
      const m = new T.LineBasicMaterial({ color, transparent: opacity < 1, opacity, depthTest: false });
      const o = new T.LineSegments(new T.BufferGeometry().setFromPoints(pts), m);
      o.renderOrder = 1;
      dimGroup.add(o);
    };
    lines(grey, DIM_GREY, 0.6);
    lines(green, DIM_GREEN, 1);
    const dims = [
      { at: [(min.x + max.x) / 2, xo, min.z], v: size.x },
      { at: [yo, (min.y + max.y) / 2, min.z], v: size.y },
      { at: [yo, zo, (min.z + max.z) / 2], v: size.z },
    ];
    for (const d of dims) {
      const e = el('div', 'dimlabel');
      e.textContent = `${d.v.toFixed(1)} mm`;
      host.append(e);
      dimLabels.push({ el: e, at: new T.Vector3(...d.at) });
    }
  };
  const camDir = new T.Vector3();
  const placeDimLabels = () => {
    if (!dimLabels.length) return;
    camera.getWorldDirection(camDir);
    const w = host.clientWidth, h = host.clientHeight;
    for (const d of dimLabels) {
      if (d.at.clone().sub(camera.position).dot(camDir) <= 0) { d.el.hidden = true; continue; }
      const p = d.at.clone().project(camera);
      d.el.hidden = false;
      d.el.style.transform = `translate(${((p.x + 1) / 2) * w}px, ${((1 - p.y) / 2) * h}px) translate(-50%, -50%)`;
    }
  };

  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); placeLabel(); placeDimLabels(); });

  // Raycast the shell (and the device ghost when visible) and return the feature
  // whose anchor is nearest to the hit, or null when nothing is within 60 mm.
  const ray = new T.Raycaster();
  const ndc = new T.Vector2();
  const featureAt = (x, y) => {
    const r = canvas.getBoundingClientRect();
    ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const targets = [];
    if (shell) targets.push(shell);
    if (device && device.visible) targets.push(device);
    const hit = ray.intersectObjects(targets, false)[0];
    if (!hit || !features.length) return null;
    // A device hit selects Mixer with no distance check; the marker then sits at the hit point.
    if (hit.object === device) {
      const mixer = features.find((f) => f.name === 'Mixer');
      if (mixer) return { f: mixer, at: hit.point.clone() };
    }
    const dist = (f) => hit.point.distanceTo(new T.Vector3(...f.at));
    const pick = features.reduce((best, f) => (!best || dist(f) < dist(best) ? f : best), null);
    return dist(pick) <= 60 ? { f: pick, at: null } : null;
  };

  // A click is a press and release within 4 px; anything more is an orbit drag.
  let downAt = null, hoverAt = null, hoverFrame = 0;
  canvas.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener('pointercancel', () => { downAt = null; });
  canvas.addEventListener('pointerup', (e) => {
    if (!downAt) return;
    const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 4;
    downAt = null;
    if (!moved) {
      const r = featureAt(e.clientX, e.clientY);
      select(r ? r.f.name : null, r?.at);
    }
  });
  const hideTip = () => { tip.hidden = true; canvas.style.cursor = ''; };
  canvas.addEventListener('pointermove', (e) => {
    hoverAt = { x: e.clientX, y: e.clientY, dragging: e.buttons !== 0 };
    if (hoverFrame) return;
    hoverFrame = requestAnimationFrame(() => {
      hoverFrame = 0;
      if (!hoverAt) return hideTip();
      const picked = hoverAt.dragging ? null : featureAt(hoverAt.x, hoverAt.y);
      const f = picked && picked.f;
      if (!f) return hideTip();
      const r = host.getBoundingClientRect();
      tip.textContent = f.name;
      tip.style.transform = `translate(${hoverAt.x - r.left + 14}px, ${hoverAt.y - r.top + 14}px)`;
      tip.hidden = false;
      canvas.style.cursor = 'pointer';
    });
  });
  canvas.addEventListener('pointerleave', () => { hoverAt = null; hideTip(); });

  const frame = (dir) => {
    const v = T.MathUtils.degToRad(camera.fov) / 2;
    const h = Math.atan(Math.tan(v) * camera.aspect);
    const dist = (radius / Math.sin(Math.min(v, h))) * 1.1;
    camera.near = dist / 100; camera.far = dist * 100;
    camera.updateProjectionMatrix();
    controls.target.copy(center);
    camera.position.copy(center).addScaledVector(dir.clone().normalize(), dist);
    controls.update();
  };
  const VIEWS = { iso: [1, -1, 0.9], top: [0.001, -0.001, 1], front: [0, -1, 0.001] };
  const view = (name) => frame(name === 'fit'
    ? camera.position.clone().sub(controls.target)
    : new T.Vector3(...VIEWS[name]));

  const load = (url) => new Promise((ok, fail) => loader.load(url, ok, undefined, fail));
  const mesh = (geo, mat) => {
    geo.computeVertexNormals();
    return new T.Mesh(geo, mat);
  };
  const drop = (m) => { if (m) { root.remove(m); m.geometry.dispose(); } };

  return {
    view,
    probe: (x, y) => featureAt(x, y),  // for debugging from the console
    setDevice(on) { devOn = on; if (device) device.visible = on; },
    setDims(on) { dimsOn = on; rebuildDims(); },
    setMarker(f, at) {
      anchored = f || null;
      marker.visible = !!f;
      label.hidden = !f;
      if (!f) return;
      anchorPos = at ? at.clone() : new T.Vector3(...f.at);
      marker.position.copy(anchorPos);
      label.replaceChildren();
      const b = el('b'); b.textContent = f.name; label.append(b);
      for (const pn of f.params) { const s = el('span', 'fp'); s.textContent = pn; label.append(s); }
      placeLabel();
    },
    async show(b) {
      features = b.features || [];
      // The same key means the same meshes: a cache hit needs no download or re-parse.
      if (b.key && b.key === shownKey && shell) return;
      shownKey = b.key || null;
      const [sg, dg] = await Promise.all([load(b.shell), b.device ? load(b.device) : null]);
      drop(shell); drop(device);
      shell = mesh(sg, shellMat); root.add(shell);
      device = dg ? mesh(dg, devMat) : null;
      if (device) { device.visible = devOn; root.add(device); }
      sg.computeBoundingBox();
      const bb = sg.boundingBox;
      center = bb.getCenter(new T.Vector3());
      const s = bb.getSize(new T.Vector3());
      radius = s.length() / 2;
      marker.scale.setScalar(Math.min(1.5, Math.max(0.3, 0.004 * Math.max(s.x, s.y, s.z))));
      box = bb.clone();
      rebuildDims();
      if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
      const g = Math.max(10, Math.ceil((Math.max(s.x, s.y) * 1.5) / 10) * 10);
      grid = new T.GridHelper(g, g / 10, 0x8a939e, 0xb8c0ca);
      grid.rotation.x = Math.PI / 2;
      grid.position.set(center.x, center.y, 0);
      scene.add(grid);
      if (!fitted) { fitted = true; view('iso'); }
    },
  };
}

/* ---- Technical drawing sheet ---- */
const SVG_NS = 'http://www.w3.org/2000/svg';
const DIM_HEX = getComputedStyle(document.documentElement).getPropertyValue('--dim').trim() || '#15803d';
const MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
const SHEET = { W: 960, H: 680, M: 12, TB: 40 };
const SHEET_VIEWS = [
  { key: 'top', title: 'Top (from +Z)', annotate: true, axes: [0, 1] },
  { key: 'front', title: 'Front (from −Y)', annotate: true, axes: [0, 2] },
  { key: 'right', title: 'Right (from +X)', annotate: true, axes: [1, 2] },
  { key: 'iso', title: 'Isometric', annotate: false, axes: [0, 1, 2] },
];
const f1 = (v) => Number(v).toFixed(1);
const sv = (tag, attrs = {}, text) => {
  const e = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
};
let drawingMode = false, drawSeq = 0;
const drawCache = new Map(); // build key -> payload

function parseView(str) {
  const doc = new DOMParser().parseFromString(str, 'image/svg+xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('invalid SVG');
  const root = doc.documentElement;
  let vb = (root.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
  if (vb.length !== 4 || vb.some(Number.isNaN)) {
    vb = [0, 0, parseFloat(root.getAttribute('width')) || 100, parseFloat(root.getAttribute('height')) || 100];
  }
  return { root, vb };
}

const isGreyColor = (c) => {
  if (c === 'grey' || c === 'gray') return true;
  let m = c.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/), rgb = null;
  if (m) {
    const h = m[1].length === 3 ? m[1].replace(/./g, '$&$&') : m[1];
    rgb = [0, 2, 4].map((k) => parseInt(h.substr(k, 2), 16));
  } else if ((m = c.match(/^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/))) rgb = m.slice(1).map(Number);
  return !!rgb && rgb[0] === rgb[1] && rgb[1] === rgb[2] && rgb[0] > 0;
};
// Stroke and dash are inherited from the enclosing groups, so read them up the tree.
const inherited = (e, name) => {
  for (let n = e; n && n.getAttribute; n = n.parentNode) {
    const v = n.getAttribute(name);
    if (v != null) return v;
  }
  return null;
};
// Hidden edges are dashed or grey; visible edges are solid and not grey.

  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, 'font-family': FONT });
  svg.key = v.key; svg.A = A;
  svg.append(sv('rect', { x: 0.5, y: 0.5, width: W - 1, height: H - 1, fill: '#ffffff', stroke: '#1c2330' }));
  svg.append(sv('text', { x: 20, y: 28, 'font-size': 14, 'font-weight': 600, fill: '#1c2330' }, v.title));
  let root = null;
  try {
    const p = A ? { root: A.root, vb: A.vb } : parseView(data.views[v.key]);
    root = p.root; svg.vb = p.vb;
  } catch (e) { root = null; }
  if (root) {
    svg.viewG = sv('g');
    for (const node of root.childNodes) svg.viewG.append(document.importNode(node, true));
    svg.layer = sv('g', { class: 'layer' });
    svg.viewG.append(svg.layer);
    svg.append(svg.viewG);
    fitPage(svg, true);
  } else {
    svg.append(sv('text', { x: W / 2, y: H / 2, 'text-anchor': 'middle', 'font-size': 14, fill: '#b42318' }, `${v.title}: view unavailable`));
  }
  const ty = H - TB, b = data.bbox;
  const overall = `${v.axes.map((i) => f1(b[i])).join(' × ')} mm`;
  svg.append(sv('rect', { x: 0.5, y: ty + 0.5, width: W - 1, height: TB - 1, fill: '#f6f7f9', stroke: '#1c2330' }));
  for (const fx of [0.3, 0.5, 0.75, 0.88]) svg.append(sv('path', { d: `M${W * fx} ${ty}V${H}`, stroke: '#1c2330', fill: 'none' }));
  const cols = [
    [20, state.model, 600, '#1c2330'], [W * 0.3 + 10, v.title, 400, '#1c2330'], [W * 0.5 + 10, overall, 400, DIM_HEX],
    [W * 0.75 + 10, `Date ${new Date().toISOString().slice(0, 10)}`, 400, '#1c2330'], [W * 0.88 + 10, 'scale: fit', 400, '#1c2330'],
  ];
  for (const [x, t, w, fill] of cols) svg.append(sv('text', { x, y: ty + 16, 'font-size': 11, 'font-weight': w, fill }, t));
  return svg;
}
function buildPages(data) {
  const an = analyzeAll(data), out = {};
  for (const v of SHEET_VIEWS) out[v.key] = buildPage(data, v, an[v.key] || null);
  return out;
}
// Stacked pages for the all-views download, each with its own frame and title strip.
function stackPages(list) {
  const { W, H } = PAGE, gap = 16, n = list.length, h = n * H + (n - 1) * gap;
  const out = sv('svg', { viewBox: `0 0 ${W} ${h}`, width: W, height: h, 'font-family': FONT });
  list.forEach((p, i) => {
    const g = sv('g', { transform: `translate(0 ${i * (H + gap)})` });
    for (const c of Array.from(p.childNodes)) g.append(c.cloneNode(true));
    out.append(g);
  });
  return out;
}
function renderPage(svg, opts) {
  if (!svg || !svg.cell) return;
  if (svg.full !== !!opts.full) fitPage(svg, !!opts.full);
  const c = svg.cell;
  const kids = [dimOverlay(c.A, c.s, c.L, !!opts.full)];
  for (const p of opts.pins.get(svg.key) || []) kids.push(selectionOverlay(c.A, c.s, c.L, p, 0.45));
  if (opts.hover && opts.hover.key === svg.key) kids.push(selectionOverlay(c.A, c.s, c.L, opts.hover, 1));
  c.layer.replaceChildren(...kids);
}
const liveOpts = () => ({ full: sheetUI.showAll, pins: sheetUI.pins, hover: sheetUI.hover });
function showSheetMsg(text, bad) {
  const m = $('sheetMsg');
  m.hidden = !text;
  m.classList.toggle('err', !!bad);
  m.replaceChildren();
  if (text && !bad) m.append(el('span', 'spin'));
  if (text) m.append(text);
}
function showSheet(data) {
  showSheetMsg('', false);
  if (data.key !== sheetUI.pinKey) { sheetUI.pins.clear(); sheetUI.hover = null; sheetUI.pinKey = data.key; }
  if (data.key !== pagesKey) { pages = buildPages(data); pagesKey = data.key; }
  showPage(sheetUI.page);
}
function showPage(key) {
  if (!pages[key]) return;
  if (curKey && curKey !== key) zooms[curKey] = { ...zoom };
  curKey = key;
  sheetUI.page = key;
  sheetUI.hover = null;
  try { localStorage.setItem('cfg.drawing.page', key); } catch (e) { /* storage unavailable */ }
  liveSvg = pages[key];
  Object.assign(zoom, zooms[key] || { z: 1, tx: 0, ty: 0, fitted: false });
  paper.replaceChildren(liveSvg);
  for (const b of document.querySelectorAll('#pager button')) b.setAttribute('aria-pressed', String(b.dataset.page === key));
  renderPage(liveSvg, liveOpts());
  applyZoom();
  if (!zoom.fitted) fitSheet();
}
async function fetchDrawing() {
  const r = await fetch('/api/drawing');
  const data = await r.json().catch(() => ({ ok: false, log: `HTTP ${r.status}: invalid response` }));
  if (data.ok && data.key) drawCache.set(data.key, data);
  return data;
}
// Draw the pages for the current build key, fetching only when that key is not cached.
async function ensureDrawing(retry = true) {
  const want = state.buildKey;
  if (want && drawCache.has(want)) { showSheet(drawCache.get(want)); return; }
  const seq = ++drawSeq;
  showSheetMsg('Drawing…', false);
  let data;
  try { data = await fetchDrawing(); } catch (e) { data = { ok: false, log: String(e) }; }
  if (seq !== drawSeq) return;
  if (!data.ok) { if (drawingMode) showSheetMsg(data.log || 'Drawing failed', true); return; }
  if (drawingMode) showSheet(data);
  if (retry && state.buildKey && state.buildKey !== data.key) ensureDrawing(false);
}

// ---- Zoom and pan (zoom state is per page)
const zoom = { z: 1, tx: 0, ty: 0, fitted: false };
const vp = $('sheetVp'), paper = $('sheetPaper');
const applyZoom = () => { paper.style.transform = `translate(${zoom.tx}px, ${zoom.ty}px) scale(${zoom.z})`; };
const clampZ = (z) => Math.min(8, Math.max(0.5, z));
function fitSheet() {
  const w = vp.clientWidth, h = vp.clientHeight;
  if (!w || !h) return;
  zoom.z = clampZ(Math.min(w / SHEET_W, h / SHEET_H) * 0.98);
  zoom.tx = (w - SHEET_W * zoom.z) / 2; zoom.ty = (h - SHEET_H * zoom.z) / 2;
  zoom.fitted = true;
  applyZoom();
}
// Zoom to z keeping the sheet point under viewport point (cx, cy) fixed.
function zoomAt(cx, cy, z) {
  z = clampZ(z);
  const wx = (cx - zoom.tx) / zoom.z, wy = (cy - zoom.ty) / zoom.z;
  zoom.z = z; zoom.tx = cx - wx * z; zoom.ty = cy - wy * z;
  applyZoom();
}
function zoomActual() {
  zoom.z = 1;
  zoom.tx = (vp.clientWidth - SHEET_W) / 2; zoom.ty = (vp.clientHeight - SHEET_H) / 2;
  applyZoom();
}
vp.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = vp.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, zoom.z * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)));
}, { passive: false });
let pan = null;
vp.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  pan = { x: e.clientX, y: e.clientY, tx: zoom.tx, ty: zoom.ty };
  vp.setPointerCapture(e.pointerId);
  vp.classList.add('panning');
});

// ---- Hover and pins: hit tests use sheet px (zoom and pan converted out)
const sheetPoint = (cx, cy) => {
  const r = vp.getBoundingClientRect();
  return [(cx - r.left - zoom.tx) / zoom.z, (cy - r.top - zoom.ty) / zoom.z];
};
// Nearest level per axis within 24 px of the cursor, on the current page.
function selectAt(sx, sy) {
  const c = liveSvg && liveSvg.cell;
  if (!c) return null;
  const nearest = (levels, toPx, p) => {
    let best = null, bd = 24;
    levels.forEach((v, k) => { const d = Math.abs(toPx(v) - p); if (d <= bd) { bd = d; best = k; } });
    return best;
  };
  const x = nearest(c.A.xs, (v) => c.px + (c.A.pX(v) - c.vx) * c.s, sx);
  const y = nearest(c.A.ys, (v) => c.py + (c.A.pY(v) - c.vy) * c.s, sy);
  return x == null && y == null ? null : { key: liveSvg.key, x, y };
}
const hoverAtClient = (cx, cy) => selectAt(...sheetPoint(cx, cy));
function setHover(h) {
  const old = sheetUI.hover;
  if (old === h || (old && h && old.key === h.key && old.x === h.x && old.y === h.y)) return;
  sheetUI.hover = h;
  renderPage(liveSvg, liveOpts());
}
function togglePin(h) {
  const arr = sheetUI.pins.get(h.key) || [];
  const k = arr.findIndex((p) => p.x === h.x && p.y === h.y);
  if (k >= 0) arr.splice(k, 1);
  else { arr.push({ x: h.x, y: h.y }); if (arr.length > 6) arr.shift(); }
  sheetUI.pins.set(h.key, arr);
  renderPage(liveSvg, liveOpts());
}
let hoverRaf = 0, hoverPt = null;
vp.addEventListener('pointermove', (e) => {
  if (pan) {
    zoom.tx = pan.tx + e.clientX - pan.x; zoom.ty = pan.ty + e.clientY - pan.y;
    applyZoom();
    return;
  }
  hoverPt = { x: e.clientX, y: e.clientY };
  if (!hoverRaf) hoverRaf = requestAnimationFrame(() => {
    hoverRaf = 0;
    if (hoverPt && !pan) setHover(hoverAtClient(hoverPt.x, hoverPt.y));
  });
});
vp.addEventListener('pointerleave', () => { hoverPt = null; if (!pan) setHover(null); });
// A click without a drag pins or unpins the hovered set.
const endPan = (e) => {
  if (pan && e && e.type === 'pointerup' && Math.hypot(e.clientX - pan.x, e.clientY - pan.y) < 4) {
    const h = hoverAtClient(e.clientX, e.clientY);
    if (h) togglePin(h);
  }
  pan = null;
  vp.classList.remove('panning');
};
vp.addEventListener('pointerup', endPan);
vp.addEventListener('pointercancel', endPan);
vp.addEventListener('dblclick', (e) => {
  const r = vp.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, zoom.z * 2);
});
new ResizeObserver(() => { if (drawingMode) fitSheet(); }).observe(vp);
$('zFit').addEventListener('click', fitSheet);
$('zIn').addEventListener('click', () => zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, zoom.z * 1.25));
$('zOut').addEventListener('click', () => zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, zoom.z / 1.25));
$('z1').addEventListener('click', zoomActual);
$('showAll').checked = sheetUI.showAll;
$('showAll').addEventListener('change', () => {
  sheetUI.showAll = $('showAll').checked;
  try { localStorage.setItem('cfg.drawing.showAll', sheetUI.showAll ? '1' : '0'); } catch (e) { /* storage unavailable */ }
  renderPage(liveSvg, liveOpts());
});
document.addEventListener('keydown', (e) => {
  if (!drawingMode) return;
  if (e.key === 'Escape' && sheetUI.pins.size) { sheetUI.pins.clear(); renderPage(liveSvg, liveOpts()); }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) {
    const i = PAGE_KEYS.indexOf(curKey), n = PAGE_KEYS.length;
    showPage(PAGE_KEYS[(i + (e.key === 'ArrowRight' ? 1 : n - 1)) % n]);
    e.preventDefault();
  }
});
document.querySelectorAll('#pager button').forEach((b) => b.addEventListener('click', () => showPage(b.dataset.page)));

function setMode(mode) {
  drawingMode = mode === 'drawing';
  $('viewer').classList.toggle('drawing', drawingMode);
  $('sheet').hidden = !drawingMode;
  for (const b of document.querySelectorAll('#modeSeg button')) b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
  if (drawingMode) {
    if (!zoom.fitted) fitSheet();
    ensureDrawing();
  }
}
document.querySelectorAll('#modeSeg button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));

// ---- Downloads: the unzoomed page(s), always with the full chains and the pinned sets
function downloadSvg(svg, name) {
  const xml = new XMLSerializer().serializeToString(svg);
  const url = URL.createObjectURL(new Blob([xml], { type: 'image/svg+xml' }));
  const a = el('a'); a.href = url; a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function downloadDrawing(all) {
  const data = drawCache.get(state.buildKey) ?? await fetchDrawing();
  if (!data.ok) throw new Error(data.log || 'Drawing failed');
  const an = analyzeAll(data);
  const opts = { full: true, pins: sheetUI.pins, hover: null };
  if (all) {
    const list = SHEET_VIEWS.map((v) => { const p = buildPage(data, v, an[v.key] || null); renderPage(p, opts); return p; });
    downloadSvg(stackPages(list), `${state.stem}_drawing_all.svg`);
  } else {
    const v = SHEET_VIEWS.find((x) => x.key === curKey) || SHEET_VIEWS[0];
    const p = buildPage(data, v, an[v.key] || null);
    renderPage(p, opts);
    downloadSvg(p, `${state.stem}_drawing.svg`);
  }
}
for (const [id, all] of [['dlDrawing', false], ['dlAll', true]]) {
  $(id).addEventListener('click', async (e) => {
    e.preventDefault();
    try { await downloadDrawing(all); } catch (err) { showLog(`Drawing download failed: ${err.message}`, true); }
  });
}

const viewerReady = loadViewer().then((v) => (viewer = v, window.__viewer = v));
init();
</script>
