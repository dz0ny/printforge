[project]
name = "printforge-configurator"
version = "0.1.0"
description = "A local web configurator for CadQuery model scripts: sliders for the device, the shell rebuilds"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
printforge-configurator = "printforge_configurator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["printforge_configurator"]
